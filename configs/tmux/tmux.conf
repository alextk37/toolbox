# ─────────────────────────────────────────────────────────────
# Hermes tmux config — dev-friendly, minimal, fast
# tmux 3.4+
# ─────────────────────────────────────────────────────────────

# ─── Terminal ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",*256col*:Tc"
set -g allow-passthrough on
set -g focus-events on

# ─── Mouse ──────────────────────────────────────────────────
set -g mouse on

# ─── History ────────────────────────────────────────────────
set -g history-limit 50000

# ─── Base index (start counting from 1) ─────────────────────
set -g base-index 1
setw -g pane-base-index 1

# ─── Faster escape-time (vim/nvim users) ────────────────────
set -s escape-time 10

# ─── Windows auto-rename ────────────────────────────────────
setw -g automatic-rename on
set -g renumber-windows on

# ─── Vi copy mode ───────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── Pane splitting ─────────────────────────────────────────
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (Alt + arrows) ─────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ─── Pane resizing (Alt + Shift + arrows) ───────────────────
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3

# ─── Reload config ──────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "✓ Config reloaded"

# ─── Quick session switch ───────────────────────────────────
bind C-f choose-tree -s

# ─── Kill pane without confirmation ─────────────────────────
bind x kill-pane

# ─── Smart pane focus (toggle last pane) ────────────────────
bind Tab last-pane

# ─── Maximize/restore pane ──────────────────────────────────
bind m resize-pane -Z

# ─── Prompts ────────────────────────────────────────────────
set -g status-justify "left"
set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5

# ─── Message style ──────────────────────────────────────────
set -g message-style "fg=#c0caf5,bg=#1a1b26"
set -g message-command-style "fg=#c0caf5,bg=#1a1b26"

# ────────────────────────────────────────────────────────────
# STATUS BAR — Nord dark theme
# ────────────────────────────────────────────────────────────

# Colors
NORD0="#2e3440"
NORD1="#3b4252"
NORD2="#434c5e"
NORD3="#4c566a"
NORD4="#d8dee9"
NORD5="#e5e9f0"
NORD6="#eceff4"
NORD7="#8fbcbb"
NORD8="#88c0d0"
NORD9="#81a1c1"
NORD10="#5e81ac"
NORD11="#bf616a"
NORD12="#d08770"
NORD13="#ebcb8b"
NORD14="#a3be8c"
NORD15="#b48ead"

# Status bar background
set -g status-style "fg=${NORD4},bg=${NORD0}"
set -g status-left "#[fg=${NORD0},bg=${NORD8},bold] #S #[fg=${NORD8},bg=${NORD2}]"
set -g status-right "#[fg=${NORD4},bg=${NORD2}] %H:%M:%S #[fg=${NORD0},bg=${NORD13}]  %d.%m #[fg=${NORD13},bg=${NORD0}]"

# Window list
set -g window-status-format "#[fg=${NORD3},bg=${NORD0}] #I #W "
set -g window-status-current-format "#[fg=${NORD0},bg=${NORD8},bold] #I #W #[fg=${NORD8},bg=${NORD0}]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=${NORD14},bg=${NORD0},bold"

# Pane borders
set -g pane-border-style "fg=${NORD2}"
set -g pane-active-border-style "fg=${NORD8}"

# Mode indicator (copy mode)
set -g mode-style "fg=${NORD0},bg=${NORD14},bold"

